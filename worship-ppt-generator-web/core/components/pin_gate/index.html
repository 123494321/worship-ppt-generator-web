<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIN Gate</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  }

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    user-select: none;
    -webkit-user-select: none;
  }

  .pin-card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    padding: 38px 28px 32px 28px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    border: 1px solid #e2e8f0;
    text-align: center;
    position: relative;
    cursor: default;
  }

  .pin-icon {
    font-size: 3.2rem;
    margin-bottom: 12px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .pin-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: #1e3a8a;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .pin-subtitle {
    font-size: 0.95rem;
    color: #64748b;
    margin-bottom: 28px;
    line-height: 1.4;
  }

  /* Hidden input covering the PIN boxes area */
  .hidden-input {
    position: absolute;
    opacity: 0;
    pointer-events: auto;
    width: 100%;
    height: 60px;
    left: 0;
    bottom: 80px;
    z-index: 10;
    cursor: pointer;
  }

  /* 4 PIN Box Container */
  .pin-boxes {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }

  .pin-box {
    width: 58px;
    height: 64px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    color: #1e3a8a;
    background: #f8fafc;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.04);
  }

  .pin-box.active {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    transform: translateY(-2px);
  }

  .pin-box.filled {
    border-color: #3b82f6;
    background: #ffffff;
  }

  .pin-box.error {
    border-color: #ef4444 !important;
    background: #fef2f2 !important;
    color: #ef4444 !important;
  }

  .pin-box.success {
    border-color: #10b981 !important;
    background: #ecfdf5 !important;
    color: #10b981 !important;
  }

  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #1e3a8a;
    transform: scale(0);
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .pin-dot.visible {
    transform: scale(1);
  }

  .status-msg {
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 24px;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .status-msg.error {
    color: #ef4444;
  }

  .status-msg.success {
    color: #10b981;
  }

  /* Shake animation for incorrect password */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .shake {
    animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
</style>
</head>
<body>

<div class="pin-card" id="pinCard" onclick="focusInput()">
  <div class="pin-icon" id="pinIcon">🔒</div>
  <div class="pin-title">LOGOS 찬양 PPT 스튜디오</div>
  <div class="pin-subtitle">비밀번호를 입력하세요.</div>

  <input 
    type="tel" 
    id="hiddenPinInput" 
    class="hidden-input" 
    inputmode="numeric" 
    pattern="[0-9]*" 
    maxlength="4" 
    autocomplete="off" 
    autofocus 
  />

  <div class="pin-boxes" id="pinBoxes">
    <div class="pin-box active" id="box0"><div class="pin-dot" id="dot0"></div></div>
    <div class="pin-box" id="box1"><div class="pin-dot" id="dot1"></div></div>
    <div class="pin-box" id="box2"><div class="pin-dot" id="dot2"></div></div>
    <div class="pin-box" id="box3"><div class="pin-dot" id="dot3"></div></div>
  </div>

  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
  let isUnlocked = false;
  const input = document.getElementById('hiddenPinInput');
  const card = document.getElementById('pinCard');
  const icon = document.getElementById('pinIcon');
  const boxes = [
    document.getElementById('box0'),
    document.getElementById('box1'),
    document.getElementById('box2'),
    document.getElementById('box3')
  ];
  const dots = [
    document.getElementById('dot0'),
    document.getElementById('dot1'),
    document.getElementById('dot2'),
    document.getElementById('dot3')
  ];
  const statusMsg = document.getElementById('statusMsg');
  const pinBoxesContainer = document.getElementById('pinBoxes');

  function sendToStreamlit(type, data) {
    window.parent.postMessage(Object.assign({
      isStreamlitMessage: true,
      type: type
    }, data), "*");
  }

  function focusInput() {
    if (!isUnlocked) {
      input.focus();
    }
  }

  function updateDisplay() {
    const val = input.value;
    const len = val.length;

    for (let i = 0; i < 4; i++) {
      if (i < len) {
        dots[i].classList.add('visible');
        boxes[i].classList.add('filled');
        boxes[i].classList.remove('active', 'error', 'success');
      } else if (i === len) {
        dots[i].classList.remove('visible');
        boxes[i].classList.remove('filled', 'error', 'success');
        boxes[i].classList.add('active');
      } else {
        dots[i].classList.remove('visible');
        boxes[i].classList.remove('filled', 'active', 'error', 'success');
      }
    }

    if (len === 0) {
      statusMsg.className = 'status-msg';
      statusMsg.innerText = '';
    } else if (len < 4) {
      statusMsg.className = 'status-msg';
      statusMsg.innerText = len + ' / 4자리 입력 중...';
    } else if (len === 4) {
      checkPin(val);
    }
  }

  let allowedPins = ["0000", "7777"];

  window.checkPin = checkPin;
  function checkPin(pin) {
    if (allowedPins.includes(pin)) {
      isUnlocked = true;
      icon.innerText = "🔓";
      icon.style.transform = "scale(1.15)";
      
      for (let i = 0; i < 4; i++) {
        boxes[i].classList.remove('active', 'error');
        boxes[i].classList.add('success');
      }

      statusMsg.className = 'status-msg success';
      if (pin !== "0000") {
        statusMsg.innerText = '🛡️ 관리자 권한 확인 완료! 콘솔을 로드합니다...';
      } else {
        statusMsg.innerText = '✨ 인증 성공! 자료실과 동기화 중입니다...';
      }

      // 즉시 Streamlit Python으로 pin 전송하여 세션 언락
      sendToStreamlit("streamlit:setComponentValue", { value: pin });
    } else {
      for (let i = 0; i < 4; i++) {
        boxes[i].classList.remove('active');
        boxes[i].classList.add('error');
      }
      
      pinBoxesContainer.classList.add('shake');
      statusMsg.className = 'status-msg error';
      statusMsg.innerText = '❌ 비밀번호가 올바르지 않습니다. 다시 입력해 주세요.';

      setTimeout(() => {
        pinBoxesContainer.classList.remove('shake');
        input.value = '';
        updateDisplay();
        input.focus();
      }, 750);
    }
  }

  input.addEventListener('input', (e) => {
    // 숫자 이외 문자 필터링
    input.value = input.value.replace(/[^0-9]/g, '').slice(0, 4);
    updateDisplay();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.length === 4) {
      checkPin(input.value);
    }
  });

  // Streamlit Custom Component Protocol
  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "streamlit:render") {
      sendToStreamlit("streamlit:setFrameHeight", { height: 380 });
      if (event.data.args && Array.isArray(event.data.args.allowed_pins)) {
        allowedPins = event.data.args.allowed_pins;
      }
    }
  });

  // Initial handshake
  let readyAttempts = 0;
  const readyInterval = setInterval(() => {
    if (readyAttempts >= 20) {
      clearInterval(readyInterval);
    } else {
      sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
      sendToStreamlit("streamlit:setFrameHeight", { height: 380 });
      readyAttempts++;
    }
  }, 100);

  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  sendToStreamlit("streamlit:setFrameHeight", { height: 380 });

  // Auto focus input on load
  window.addEventListener('DOMContentLoaded', () => {
    focusInput();
  });
  window.addEventListener('load', () => {
    focusInput();
    setTimeout(focusInput, 300);
  });
  document.addEventListener('click', focusInput);
</script>

</body>
</html>
